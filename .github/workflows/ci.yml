name: EvalForge CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install zero-dependency package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run AST gate, subprocess sandbox & mock-Ollama test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke-test CLI RLHF/DPO preference export
        run: |
          evalforge arena --model-a mock:optimal --model-b mock:flawed --export-dpo-jsonl artifacts/dpo_pairs.jsonl --output-json artifacts/arena.json
          test -f artifacts/dpo_pairs.jsonl
          test -f artifacts/arena.json
